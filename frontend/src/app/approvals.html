<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151e1a">
  <title>Duyệt nội dung · MediaHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../features/approvals/approvals.css">
  <script src="../features/approvals/approvals.js" defer></script>
</head>
<body class="approvals-app">
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="icon-channel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 8h10M7 12h6M7 16h8"/></symbol>
    <symbol id="icon-content" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="icon-task" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="icon-approve" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 20v-7M10 20V8M16 20V4M22 20V10"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-4-5"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </svg>

  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Không gian làm việc">
      <a class="brand" href="./approvals.html" aria-label="MediaHub — Duyệt nội dung"><span class="brand-mark">m.</span><span>mediahub</span></a>
      <p class="nav-label">Workspace</p>
      <nav class="navigation" aria-label="Điều hướng chính">
        <button class="nav-item" type="button" data-section="Tổng quan"><svg class="icon"><use href="#icon-grid"/></svg><span>Tổng quan</span></button>
        <button class="nav-item" type="button" data-section="Kênh truyền thông"><svg class="icon"><use href="#icon-channel"/></svg><span>Kênh truyền thông</span></button>
        <a class="nav-item" href="./composer.html"><svg class="icon"><use href="#icon-content"/></svg><span>Thư viện nội dung</span></a>
        <a class="nav-item is-active" href="./approvals.html" aria-current="page"><svg class="icon"><use href="#icon-approve"/></svg><span>Duyệt nội dung</span></a>
        <button class="nav-item" type="button" data-section="Lịch xuất bản"><svg class="icon"><use href="#icon-calendar"/></svg><span>Lịch xuất bản</span></button>
        <button class="nav-item" type="button" data-section="Công việc"><svg class="icon"><use href="#icon-task"/></svg><span>Công việc</span></button>
        <button class="nav-item" type="button" data-section="Báo cáo phân tích"><svg class="icon"><use href="#icon-chart"/></svg><span>Báo cáo phân tích</span></button>
        <a class="nav-item" href="./user_management.html"><svg class="icon"><use href="#icon-users"/></svg><span>Người dùng</span></a>
        <a class="nav-item" href="./settings.html"><svg class="icon"><use href="#icon-settings"/></svg><span>Cấu hình hệ thống</span></a>
      </nav>
      <div class="sidebar-bottom">
        <button class="account-button" type="button" id="account-button"><span class="avatar avatar-account" id="user-initial" aria-hidden="true">?</span><span id="user-name">Chưa đăng nhập</span></button>
        <button class="nav-item" type="button" id="logout-button" hidden><span>Đăng xuất</span></button>
      </div>
    </aside>

    <div class="workspace-main">
      <header class="topbar">
        <div class="breadcrumb"><span>MediaHub</span><span class="breadcrumb-divider">/</span><span>Duyệt nội dung</span></div>
        <div class="topbar-actions"><span class="role-badge" id="user-role">Chưa đăng nhập</span></div>
      </header>

      <main class="page-content" id="main-content">
        <section class="page-heading" aria-labelledby="page-title">
          <div><p class="eyebrow">Quy trình nội dung</p><h1 id="page-title">Duyệt nội dung.</h1>
          <p class="page-description">Nháp → Chờ duyệt → Đã duyệt hoặc Từ chối. Chỉ nội dung đã duyệt mới được lên lịch.</p></div>
        </section>

        <p class="notice notice-error" id="load-error" role="alert" hidden></p>

        <section class="panel" id="login-panel" aria-labelledby="login-title" hidden>
          <h2 class="panel-title" id="login-title">Đăng nhập</h2>
          <p class="notice notice-error" id="login-error" role="alert" hidden></p>
          <form id="login-form" novalidate>
            <label for="login-username">Tên đăng nhập hoặc email</label>
            <input id="login-username" type="text" autocomplete="username">
            <label for="login-password">Mật khẩu</label>
            <input id="login-password" type="password" autocomplete="current-password">
            <button type="submit" class="button button-primary" id="login-submit">Đăng nhập</button>
          </form>
        </section>

        <div id="app-panel" hidden>
          <div class="tabs" role="tablist">
            <button type="button" class="tab is-active" role="tab" id="tab-mine" aria-selected="true" aria-controls="list" data-tab="mine">Bài của tôi</button>
            <button type="button" class="tab" role="tab" id="tab-pending" aria-selected="false" aria-controls="list" data-tab="pending" hidden>Chờ tôi duyệt <span class="count" id="pending-count">0</span></button>
          </div>
          <ul class="post-list" id="list" aria-live="polite"></ul>
          <p class="empty" id="empty" hidden></p>
        </div>
      </main>
    </div>
  </div>

  <dialog class="reject-dialog" id="reject-dialog" aria-labelledby="reject-title">
    <form method="dialog" id="reject-form" novalidate>
      <h2 id="reject-title">Từ chối nội dung</h2>
      <p class="dialog-sub" id="reject-post-title"></p>
      <label for="reject-reason">Lý do từ chối <span class="required">(bắt buộc)</span></label>
      <textarea id="reject-reason" rows="4" maxlength="1000" placeholder="Nêu rõ cần sửa gì để nhân viên chỉnh lại..."></textarea>
      <p class="notice notice-error" id="reject-error" role="alert" hidden></p>
      <div class="dialog-footer">
        <button type="button" class="button button-secondary" id="reject-cancel">Hủy</button>
        <button type="submit" class="button button-danger" id="reject-confirm">Từ chối</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
